    /* Nur Fließtext: eine Spalte, ruhige Abstände */
    /* Eine Glasscheibe zum Lesen; der Himmel bleibt verschwommen dahinter */
    .legal {
      position: relative;
      max-width: 760px;
      margin: 12px max(12px, calc((100% - 760px) / 2)) 56px;

      animation: legal-in 0.8s var(--ease) both;
    }
    .legal::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: var(--rim);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;

      pointer-events: none;
    }
    @keyframes legal-in { from { opacity: 0; translate: 0 20px; filter: blur(6px); } }

    .legal a:hover { color: var(--bright); text-decoration-color: currentColor; }
    .legal .lead { color: var(--bright); }
